apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: airtablesyncconfigs.dpa.com
spec:
  group: dpa.com
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                airtableApiKey:
                  type: string
                airtableBaseId:
                  type: string
                airtableTableName:
                  type: string
                syncInterval:
                  type: string
  scope: Namespaced
  names:
    plural: airtablesyncconfigs
    singular: airtablesyncconfig
    kind: AirtableSyncConfig
    shortNames:
      - atsc
